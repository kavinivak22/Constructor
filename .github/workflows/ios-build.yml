name: Build iOS App (Free Cloud Runner)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios-simulator:
    name: Build Native iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify Xcode & Tools
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Build iOS Simulator App
        run: |
          echo "Compiling Compose Multiplatform SharedApp for both Simulator architectures (x86_64 and arm64)..."
          cd constructor-app
          chmod +x gradlew
          ./gradlew :shared:linkDebugFrameworkIosX64 :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace
          cd ..

          echo "Creating Universal (Fat) SharedApp.framework containing x86_64 and arm64..."
          mkdir -p ios/Frameworks
          ARM64_FW=$(find constructor-app/shared/build -path "*/iosSimulatorArm64/*" -name "SharedApp.framework" | head -n 1)
          X64_FW=$(find constructor-app/shared/build -path "*/iosX64/*" -name "SharedApp.framework" | head -n 1)
          echo "Found ARM64 framework: $ARM64_FW"
          echo "Found X64 framework: $X64_FW"

          cp -R "$ARM64_FW" ios/Frameworks/
          lipo -create "$ARM64_FW/SharedApp" "$X64_FW/SharedApp" -output ios/Frameworks/SharedApp.framework/SharedApp

          echo "Verifying universal SharedApp Mach-O slices:"
          lipo -info ios/Frameworks/SharedApp.framework/SharedApp

          echo "Compiling native iOS application for Universal Simulator (x86_64 + arm64)..."
          cd ios
          xcodebuild -scheme Constructor -sdk iphonesimulator ARCHS="x86_64 arm64" ONLY_ACTIVE_ARCH=NO -configuration Debug -derivedDataPath build
          cd ..
          mkdir -p build-output
          find ios/build/Build/Products/Debug-iphonesimulator -name "*.app" -exec cp -R {} build-output/ \;

          echo "Embedding Universal SharedApp.framework into Constructor.app/Frameworks..."
          mkdir -p build-output/Constructor.app/Frameworks
          cp -R ios/Frameworks/SharedApp.framework build-output/Constructor.app/Frameworks/

          echo "Ad-hoc codesigning embedded framework and app bundle..."
          codesign --force --sign - --timestamp=none build-output/Constructor.app/Frameworks/SharedApp.framework
          codesign --force --sign - --timestamp=none build-output/Constructor.app

          echo "Verifying Constructor.app binary architectures:"
          lipo -info build-output/Constructor.app/Constructor
          lipo -info build-output/Constructor.app/Frameworks/SharedApp.framework/SharedApp

          cd build-output
          zip -r ../appetize-upload.zip *.app
          cd ..

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Constructor-iOS-Simulator
          path: build-output/Constructor.app
          retention-days: 14

      - name: Upload to Appetize.io (Optional Free In-Browser Simulator)
        if: env.APPETIZE_API_TOKEN != ''
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          echo "Uploading to Appetize.io for instant in-browser testing..."
          curl --location --request POST 'https://api.appetize.io/v1/apps' \
            --header "Authorization: Bearer $APPETIZE_API_TOKEN" \
            --form "file=@appetize-upload.zip" \
            --form "platform=ios"
