name: Build iOS App (Free Cloud Runner)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios-simulator:
    name: Build Native iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify Xcode & Tools
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Build iOS Simulator App
        run: |
          echo "Compiling Compose Multiplatform SharedApp for iOS Simulator..."
          cd constructor-app
          chmod +x gradlew
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace
          cd ..
          mkdir -p ios/Frameworks
          find constructor-app/shared/build -name "SharedApp.framework" -exec cp -R {} ios/Frameworks/ \;
          echo "Verified SharedApp.framework in ios/Frameworks:"
          ls -la ios/Frameworks/SharedApp.framework

          echo "Compiling native iOS application..."
          cd ios
          xcodebuild -scheme Constructor -sdk iphonesimulator -configuration Debug -derivedDataPath build
          cd ..
          mkdir -p build-output
          find ios/build/Build/Products/Debug-iphonesimulator -name "*.app" -exec cp -R {} build-output/ \;
          cd build-output
          zip -r ../appetize-upload.zip *.app
          cd ..

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Constructor-iOS-Simulator
          path: build-output/Constructor.app
          retention-days: 14

      - name: Upload to Appetize.io (Optional Free In-Browser Simulator)
        if: env.APPETIZE_API_TOKEN != ''
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          echo "Uploading to Appetize.io for instant in-browser testing..."
          curl --location --request POST 'https://api.appetize.io/v1/apps' \
            --header "Authorization: Bearer $APPETIZE_API_TOKEN" \
            --form "file=@appetize-upload.zip" \
            --form "platform=ios"
